<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--void:#090A08;--ink:#131412;--ink-2:#1C1E1B;--ink-3:#2A2D29;--hair:#2A2D29;--hair-strong:#3C403B;--bone:#F2F3F0;--bone-dim:#C4C8C1;--bone-mute:#8F948D;--az:#3d8fff;--azg:#5b6bff;--sans:'Montserrat',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--e:cubic-bezier(.2,.7,.2,1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--bone);font-family:var(--sans);font-weight:400;overflow:hidden;-webkit-font-smoothing:antialiased}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}

  .lamp.sq{border-color:var(--bone)} .lamp.sk{background:var(--az);border-color:var(--az)} .lamp.hub{border:0}
  .reader{inset:0;background:var(--void);z-index:10;display:grid;grid-template-columns:280px 1fr 300px;grid-template-rows:56px 1fr;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .32s var(--e),visibility 0s linear .32s}
  body.reader-open .reader{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .32s var(--e),visibility 0s}

  .md blockquote{margin:12px 0;padding:4px 16px;border-left:2px solid var(--az);color:var(--bone-dim)} .md hr{border:0;border-top:1px solid var(--hair);margin:24px 0} .md strong{font-weight:500;color:var(--bone)}
  .side{border-left:1px solid var(--hair);display:flex;flex-direction:column;background:var(--ink);min-height:0}
  .side .kicker{padding:16px 18px 8px} .side .links{padding:10px 18px;overflow:auto}
  .side .lk{padding:7px 0;font-size:12.5px;font-weight:300;color:var(--bone-dim);cursor:pointer;display:flex;gap:8px;align-items:center} .side .lk:hover{color:var(--bone)} .side .lk i{width:5px;height:5px;border-radius:50%;background:#3a3a42;flex:none}
  .empty{padding:40px;color:var(--bone-mute);font-weight:300;font-size:14px}
  .tip{position:absolute;z-index:3;pointer-events:none;background:var(--ink);border:1px solid var(--hair-strong);border-radius:8px;padding:8px 11px;font-size:12px;max-width:300px;display:none}
  .tip b{display:block;font-weight:500;margin-bottom:2px} .tip small{color:var(--bone-mute);font-weight:300}
</style>

<style id="refine">
  .top{position:absolute;z-index:2;left:0;top:0;right:0;height:60px;display:flex;align-items:center;gap:0;padding:0 24px;background:linear-gradient(180deg,rgba(9,10,8,.96),rgba(9,10,8,.6) 80%,rgba(9,10,8,0));transition:right .32s var(--e)}

  .brand{display:flex;align-items:center;gap:12px;pointer-events:none;flex:none;padding-right:28px;border-right:1px solid rgba(255,255,255,.08);height:34px}
  .brand svg{height:22px;width:auto} .brand .w{font-size:13px;font-weight:500;letter-spacing:.01em;line-height:1;white-space:nowrap}

  .stats{margin-left:auto;display:flex;gap:0;pointer-events:none;flex:none}
  .stat{padding:0 18px;border-left:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;justify-content:center;height:34px;min-width:88px}
  .stat:last-child{padding-right:0} .stat b{font-size:18px;line-height:1} .stat span{margin-top:4px;font-size:9px;white-space:nowrap}
  .stat.az b,.stat.am b{color:var(--az,#3d8fff)}
  .legend{left:24px;bottom:20px;gap:0;background:rgba(19,20,18,.85);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:0 6px;height:30px;align-items:center}
  .legend span{padding:0 10px;height:30px;border-right:1px solid rgba(255,255,255,.06);font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase} .legend span:last-child{border:0}
  .hint{bottom:26px;color:#4a4f49;font-size:9px}
  .feed{width:340px;bottom:20px;gap:0;background:rgba(19,20,18,.85);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:4px 12px}
  .feed .ev{border-top:1px solid rgba(255,255,255,.06);padding:8px 0} .feed .ev:first-child{border-top:0}
  .drawer{width:400px;background:#0f100e;border-left:1px solid rgba(255,255,255,.08);box-shadow:-24px 0 48px rgba(0,0,0,.35)}
  .drawer header{padding:0 24px;height:60px;border-bottom:1px solid rgba(255,255,255,.08);align-items:center;background:rgba(255,255,255,.015)}
  .drawer header .lamp{margin:0;width:28px;height:28px}
  .drawer h2{font-size:15px} .drawer h2 small{margin-top:4px;font-size:9.5px;letter-spacing:.14em}

  .drawer .body{padding:4px 24px 28px}
  .sec{padding:18px 0;border-bottom:1px solid rgba(255,255,255,.06)}
  .sec .kicker{margin-bottom:12px;display:flex;align-items:center;gap:10px} .sec .kicker::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.06)}
  .now{font-size:13.5px} .row{padding:8px 0;border-top:1px solid rgba(255,255,255,.04)} .row:first-of-type{border-top:0}
  .row .t{font-size:12.5px} .row .s{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  .tiles div{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:12px 12px} .tiles b{font-size:20px} .tiles span{letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono);font-size:9px}
  .chips{gap:6px} .chip{font-size:10px;letter-spacing:.04em;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);padding:4px 9px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:12px}
  .kv b{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-mute);font-weight:400;padding-top:2px} .kv span{color:var(--bone-dim);font-weight:300}

</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="brand"><svg viewBox="0 0 84.54 136"><polygon fill="#3d8fff" points="69.84,0.00 0.00,78.66 36.76,79.39 11.76,135.26 83.81,60.28 43.37,58.81"/></svg><div class="w">Centro de Treinamento<small>TEAM-OS · FONTE DA VERDADE</small></div></div>
  <div class="searchwrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input class="search" id="search" placeholder="buscar agente, squad ou skill…"></div>
  <div class="stats"><div class="stat"><b id="sSq">0</b><span class="kicker">squads</span></div><div class="stat"><b id="sAg">0</b><span class="kicker">agentes</span></div><div class="stat az"><b id="sSk">0</b><span class="kicker">skills</span></div><div class="stat"><b id="sPr">0</b><span class="kicker">projetos</span></div></div>
</div>
<div class="ui legend"><span><i class="sq"></i> squad</span><span><i></i> agente</span><span><i class="sk"></i> skill</span><span><i class="core"></i> skill principal</span></div>
<div class="ui hint">arraste · role para zoom · clique abre · clique na squad expande as skills · duplo clique no fundo recentra</div>
<div class="tip" id="tip"></div>
<aside class="ui drawer" id="drawer"><header><div class="lamp" id="dLamp"></div><h2><span id="dName">—</span><small id="dSub"></small></h2><button class="x" id="dClose">×</button></header><div class="body" id="dBody"></div></aside>
<section class="ui reader" id="reader">
  <div class="top"><button class="back" id="rBack">← Mapa</button><h3><span id="rTitle">Arquivo</span><small id="rSub"></small></h3><input id="rSearch" placeholder="filtrar…"></div>
  <div class="tree" id="rTree"></div><div class="note" id="rNote"></div>
  <div class="side"><div class="kicker">Ligado a</div><div class="links" id="rLinks"></div></div>
</section>

<script>
let S=null;const nodes=new Map();let links=[],hub=null,sel=null;const view={x:0,y:0,k:1};const expanded=new Set();const expandedSkills=new Set();
const BOLT=[[69.84,0],[0,78.66],[36.76,79.39],[11.76,135.26],[83.81,60.28],[43.37,58.81]];
const COL={bone:'#F2F3F0',dim:'#C4C8C1',mute:'#8F948D',az:'#3d8fff',azg:'#5b6bff',off:'#585C57'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
function resize(){const w=innerWidth,h=innerHeight;if(w===W&&h===H)return false;W=w;H=h;DPR=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);if(!hub){view.x=W*0.46;view.y=H*0.52;}return true;}
let userMoved=false,resizeT=null,loadedAt=performance.now();addEventListener('resize',()=>{if(!resize())return;if(!userMoved&&performance.now()-loadedAt<15000){clearTimeout(resizeT);resizeT=setTimeout(fitAll,1000);}});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ===== grafo ===== */
function rebuild(){
  if(!S)return;const keep=new Set();
  const get=(id,init)=>{let n=nodes.get(id);if(!n){n=Object.assign({id,x:0,y:0,vx:0,vy:0,pulse:0,glow:0,phase:Math.random()*6.28},init);nodes.set(id,n);}else Object.assign(n,init);keep.add(id);return n;};
  hub=get('hub',{kind:'hub',r:34,fixed:true});
  const sqs=S.squads;const n=sqs.length;const R=Math.max(Math.min(W,H)*0.3,n*40);
  const cores=Object.values(S.skills).filter(s=>s.core);
  cores.forEach((sk,i)=>{const a=Math.PI/2+(i-(cores.length-1)/2)*0.5;const isN=!nodes.has('k:'+sk.name);const K=get('k:'+sk.name,{kind:'skill',r:8,sk,core:true,lead:hub});if(isN){K.x=hub.x+Math.cos(a)*120;K.y=hub.y+Math.sin(a)*120;}});
  sqs.forEach((sq,i)=>{const a=-Math.PI/2+i*(Math.PI*2/n);const isN=!nodes.has('q:'+sq.name);const Q=get('q:'+sq.name,{kind:'squad',r:17,sq,ang:a});if(isN){Q.x=hub.x+Math.cos(a)*R;Q.y=hub.y+Math.sin(a)*R;}
    const m=sq.agents.length,spread=Math.min(Math.PI*0.9,0.42*m+0.3),ar=95+m*5;
    if(expanded.has(sq.name))sq.agents.forEach((an,j)=>{const ag=S.agents[an];if(!ag)return;const b=a+(m===1?0:(-spread/2+j*(spread/(m-1))));const isA=!nodes.has('a:'+an);const A=get('a:'+an,{kind:'agent',r:9,ag,lead:Q});if(isA){A.x=Q.x+Math.cos(b)*ar+(Math.random()-0.5)*6;A.y=Q.y+Math.sin(b)*ar+(Math.random()-0.5)*6;}});
    if(expandedSkills.has(sq.name)){const ks=sq.skills;const km=ks.length,ksp=Math.min(Math.PI*1.2,0.28*km+0.3),kr=175+km*3;

function physics(){const arr=[...nodes.values()];

  for(const x of arr){if(x.fixed||x.drag)continue;x.vx*=0.8;x.vy*=0.8;if(Math.abs(x.vx)<0.01)x.vx=0;if(Math.abs(x.vy)<0.01)x.vy=0;x.x+=x.vx;x.y+=x.vy;}}

/* ===== reader ===== */
const rTree=document.getElementById('rTree'),rNote=document.getElementById('rNote'),rLinks=document.getElementById('rLinks');
let R={kind:'',name:''};
window.openReader=async(kind,name)=>{document.body.classList.add('reader-open');R={kind,name};buildTree();await showFile(kind,name);};
document.getElementById('rBack').onclick=()=>document.body.classList.remove('reader-open');
document.getElementById('rSearch').oninput=e=>{const v=e.target.value.toLowerCase();rTree.querySelectorAll('.f').forEach(f=>f.classList.toggle('hidden',v&&!f.textContent.toLowerCase().includes(v)));};
function buildTree(){let h='';S.squads.forEach(sq=>{h+=`<div class="dir">${esc(sq.name)}</div>`+sq.agents.map(a=>`<div class="f" data-k="agent" data-n="${esc(a)}"><i></i>${esc(a)}</div>`).join('');});
  h+='<div class="dir">skills principais</div>'+Object.values(S.skills).filter(s=>s.core).map(s=>`<div class="f" data-k="skill" data-n="${esc(s.name)}"><i></i>${esc(s.name)}</div>`).join('');
  h+='<div class="dir">skills de apoio</div>'+Object.values(S.skills).filter(s=>!s.core).map(s=>`<div class="f" data-k="skill" data-n="${esc(s.name)}"><i></i>${esc(s.name)}</div>`).join('');
  rTree.innerHTML=h;rTree.querySelectorAll('.f').forEach(f=>f.onclick=()=>showFile(f.dataset.k,f.dataset.n));}
async function showFile(kind,name){R={kind,name};rTree.querySelectorAll('.f').forEach(f=>f.classList.toggle('on',f.dataset.k===kind&&f.dataset.n===name));const on=rTree.querySelector('.f.on');if(on)on.scrollIntoView({block:'nearest'});
  document.getElementById('rTitle').textContent=kind==='agent'?'Agente':'Skill';document.getElementById('rSub').textContent=name;
  let d;try{d=await (await fetch('/api/file?k='+kind+'&n='+encodeURIComponent(name))).json();}catch{d={error:'falha ao ler'};}
  if(d.error){rNote.innerHTML=`<div class="empty">${esc(d.error)}</div>`;return;}
  const fm=Object.entries(d.frontmatter||{}).map(([k,v])=>`<b>${esc(k)}</b><span>${esc(String(v).slice(0,200))}</span>`).join('');
  rNote.innerHTML=`<div><div class="path">${esc(d.path)}</div>${fm?`<div class="fm">${fm}</div>`:''}<div class="md">${md(d.body||'')}</div></div>`;rNote.scrollTop=0;
  rNote.querySelectorAll('a[data-k]').forEach(a=>a.onclick=ev=>{ev.preventDefault();showFile(a.dataset.k,a.dataset.n);});
  let rel=[];if(kind==='agent'){const ag=S.agents[name];rel=(ag?ag.skills:[]).map(k=>['skill',k]);}else{const sk=S.skills[name];rel=(sk?sk.used_by:[]).map(a=>['agent',a]);}
  rLinks.innerHTML=rel.map(([k,n])=>`<div class="lk" data-k="${k}" data-n="${esc(n)}"><i></i>${esc(n)}</div>`).join('')||'<div class="lk">— sem ligações</div>';rLinks.querySelectorAll('.lk[data-k]').forEach(l=>l.onclick=()=>showFile(l.dataset.k,l.dataset.n));}
function inline(s){s=esc(s);s=s.replace(/`([^`]+)`/g,(m,c)=>{const t=c.trim();if(S&&S.skills[t])return `<a data-k="skill" data-n="${esc(t)}"><code>${c}</code></a>`;if(S&&S.agents[t])return `<a data-k="agent" data-n="${esc(t)}"><code>${c}</code></a>`;return `<code>${c}</code>`;});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');s=s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<em>$2</em>');s=s.replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g,(m,t,l)=>`<a>${esc(l||t)}</a>`);s=s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');return s;}
function md(src){const lines=src.replace(/\r/g,'').replace(/<!--[\s\S]*?-->/g,'').split('\n');let out='',i=0,list=null;const closeList=()=>{if(list){out+=`</${list}>`;list=null;}};
  while(i<lines.length){let l=lines[i];
    if(/^```/.test(l)){closeList();let code='';i++;while(i<lines.length&&!/^```/.test(lines[i])){code+=lines[i]+'\n';i++;}out+=`<pre><code>${esc(code)}</code></pre>`;i++;continue;}
    if(/^\|/.test(l)&&/^\|?\s*:?-+/.test(lines[i+1]||'')){closeList();const hdr=l.split('|').filter((c,k,a)=>k>0&&k<a.length-1);let rows=[];i+=2;while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].split('|').filter((c,k,a)=>k>0&&k<a.length-1));i++;}out+=`<table><tr>${hdr.map(h=>`<th>${inline(h.trim())}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c.trim())}</td>`).join('')}</tr>`).join('')}</table>`;continue;}
    let m;if((m=l.match(/^(#{1,4})\s+(.*)/))){closeList();out+=`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`;}
    else if(/^\s*[-*]\s+/.test(l)){if(list!=='ul'){closeList();out+='<ul>';list='ul';}out+=`<li>${inline(l.replace(/^\s*[-*]\s+/,''))}</li>`;}
    else if(/^\s*\d+[.)]\s+/.test(l)){if(list!=='ol'){closeList();out+='<ol>';list='ol';}out+=`<li>${inline(l.replace(/^\s*\d+[.)]\s+/,''))}</li>`;}
    else if(/^>\s?/.test(l)){closeList();out+=`<blockquote>${inline(l.replace(/^>\s?/,''))}</blockquote>`;}
    else if(/^(-{3,}|\*{3,})\s*$/.test(l)){closeList();out+='<hr>';}
    else if(l.trim()===''){closeList();}
    else{closeList();let p=l;while(i+1<lines.length&&lines[i+1].trim()&&!/^(#|\s*[-*]\s|\s*\d+[.)]\s|>|```|\||-{3,})/.test(lines[i+1])){i++;p+=' '+lines[i];}out+=`<p>${inline(p)}</p>`;}
    i++;}closeList();return out;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.body.classList.contains('reader-open'))document.getElementById('rBack').onclick();else if(document.body.classList.contains('open'))closeDrawer();}});

/* ===== carga ===== */
let fitted=false;
async function load(){try{const r=await fetch('/api/state');S=await r.json();rebuild();sSq.textContent=S.counts.squads;sAg.textContent=S.counts.agents;sSk.textContent=S.counts.skills;sPr.textContent=S.counts.projects;if(!fitted){fitted=true;setTimeout(fitAll,700);setTimeout(()=>{if(!userMoved)fitAll();},2200);}}catch(e){}}
resize();load();setInterval(load,30000);requestAnimationFrame(frame);
</script>
