<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentes em produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#090A08;--ink:#131412;--ink-2:#1C1E1B;--ink-3:#2A2D29;
    --hair:#2A2D29;--hair-strong:#3C403B;
    --bone:#F2F3F0;--bone-dim:#C4C8C1;--bone-mute:#8F948D;
    --azure:#3d8fff;--azure-glow:#5b6bff;--azure-light:#3d8fff;--azure-deep:#0a0a33;
    --amber:#3d8fff;--amber-glow:#5b6bff;--success:#3fbf7a;--danger:#d9533d;
    --display:'Montserrat',system-ui,sans-serif;--sans:'Montserrat',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
    --e:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--void);color:var(--bone);font-family:var(--sans);font-weight:400;overflow:hidden;-webkit-font-smoothing:antialiased}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-mute)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .ui{position:absolute;z-index:2}

  .brand{left:24px;top:20px;display:flex;align-items:center;gap:12px;pointer-events:none}
  .brand svg{height:26px;width:auto;display:block}
  .brand .w{font-size:13px;font-weight:500;letter-spacing:.02em;line-height:1}
  .brand .w small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;color:var(--bone-mute);margin-top:4px}
  .brand a.xlink{pointer-events:auto;color:var(--bone-mute);text-decoration:none;letter-spacing:.06em;margin-left:10px;border-bottom:1px solid transparent}
  .brand a.xlink:hover{color:var(--bone);border-bottom-color:var(--bone-mute)}
  .live{display:flex;align-items:center;gap:7px;color:var(--bone-mute);font-family:var(--mono);font-size:10.5px}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--bone);animation:breathe 2.4s var(--e) infinite}
  .live.off i{background:var(--danger);box-shadow:none;animation:none}
  .stats{right:24px;top:20px;display:flex;gap:24px;pointer-events:none;transition:right .32s var(--e)}
  body.open .stats{right:404px}
  .stat b{display:block;font-family:var(--mono);font-weight:500;font-size:22px;line-height:1;color:var(--bone)}
  .stat.az b{color:var(--azure-light)} .stat.am b{color:var(--amber)}
  .stat span{display:block;margin-top:5px}
  .legend{left:24px;bottom:22px;display:flex;gap:18px;font-size:11px;color:var(--bone-mute);pointer-events:none}
  .legend span{display:flex;align-items:center;gap:7px}
  .legend i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--bone-mute);display:inline-block}
  .legend i.f{background:var(--bone);border-color:var(--bone)} .legend i.d{border-style:dashed} .legend i.a{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 3px #3d8fff33}
  .hint{left:50%;bottom:24px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#3a3a42;pointer-events:none;text-transform:uppercase;transition:opacity .2s}
  body.open .hint{opacity:0}

  .feed{right:24px;bottom:22px;width:330px;display:flex;flex-direction:column;gap:2px;pointer-events:none;transition:right .32s var(--e)}
  body.open .feed{right:404px}
  .ev{display:grid;grid-template-columns:52px 8px 1fr;gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--hair);font-size:12px;animation:in .4s var(--e)}
  .ev time{font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);padding-top:2px}
  .ev i{width:6px;height:6px;border-radius:50%;margin-top:6px;background:var(--bone-mute)}
  .ev.dispatch i,.ev.user i{background:var(--azure-light);box-shadow:0 0 8px var(--azure-glow)} .ev.approval i{background:var(--amber);box-shadow:0 0 0 3px #3d8fff33} .ev.done i{background:var(--success)} .ev.start i,.ev.tool i{background:var(--bone)}
  .ev b{font-weight:500} .ev small{display:block;color:var(--bone-mute);margin-top:1px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .drawer{top:0;right:0;bottom:0;width:380px;background:var(--ink);border-left:1px solid var(--hair);transform:translateX(100%);visibility:hidden;transition:transform .32s var(--e),visibility 0s linear .32s;display:flex;flex-direction:column;z-index:5}
  body.open .drawer{transform:none;visibility:visible;transition:transform .32s var(--e),visibility 0s}
  .drawer header{padding:22px 24px 16px;border-bottom:1px solid var(--hair);display:flex;gap:14px;align-items:flex-start}
  .drawer h2{margin:0;font-size:17px;font-weight:500;line-height:1.25}
  .drawer h2 small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--bone-mute);margin-top:6px;text-transform:uppercase;font-weight:400}
  .drawer .x{margin-left:auto;background:none;border:0;color:var(--bone-mute);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
  .drawer .x:hover{color:var(--bone)}
  .drawer .body{overflow:auto;padding:6px 24px 24px;flex:1}
  .sec{padding:16px 0;border-bottom:1px solid var(--hair)} .sec:last-child{border:0}
  .sec .kicker{margin-bottom:10px}
  .now{font-size:14px;font-weight:300;line-height:1.5;color:var(--bone-dim)}
  .now code,.msg code{font-family:var(--mono);font-size:11.5px;color:var(--bone-dim);background:var(--ink-3);padding:2px 6px;border-radius:4px}
  .row{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
  .row.click{cursor:pointer} .row.click:hover .t{color:var(--bone)}
  .row .n{width:10px;height:10px;border-radius:50%;flex:none}
  .row .t{flex:1;font-weight:300;color:var(--bone-dim)} .row .t b{font-weight:500;color:var(--bone)}
  .row .s{font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);white-space:nowrap}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .tiles div{background:var(--ink-2);border:1px solid var(--hair);border-radius:6px;padding:10px 12px}
  .tiles b{display:block;font-family:var(--mono);font-size:18px;font-weight:500}
  .tiles span{font-size:10.5px;color:var(--bone-mute)}
  .btn{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--azure);color:#090A08;border:0;border-radius:6px;padding:12px 14px;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:background .2s var(--e)}
  .btn:hover{background:var(--azure-glow)}
  .btn.ghost{background:var(--ink-2);color:var(--bone);border:1px solid var(--hair)} .btn.ghost:hover{background:var(--ink-3)}
  .btn[disabled]{opacity:.4;cursor:default}
  .msg{padding:8px 0;font-size:12.5px;font-weight:300;line-height:1.45;border-top:1px solid var(--hair);color:var(--bone-dim)}
  .msg b{font-weight:500;color:var(--bone)} .msg .s{font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);margin-left:6px}
  .lamp{width:32px;height:32px;border-radius:50%;border:2px solid var(--bone-mute);flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
  .lamp.f{background:var(--bone);border-color:var(--bone)} .lamp.a{background:var(--amber);border-color:var(--amber);box-shadow:0 0 0 4px #3d8fff33} .lamp.d{border-style:dashed} .lamp.hub{border:0}

  .vault{inset:0;background:var(--void);z-index:10;display:grid;grid-template-columns:270px 1fr 300px;grid-template-rows:56px 1fr;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .32s var(--e),visibility 0s linear .32s}
  body.vault-open .vault{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .32s var(--e),visibility 0s}
  /* barra do leitor fica no grid — anula o .top absoluto do mapa (senão árvore/nota/grafo sobem para a linha de 56px, atrás da barra) */
  .vault .top,body.open .vault .top{position:relative;inset:auto;height:auto;right:auto;z-index:auto} .vault .top::after{display:none}
  .vault>*{min-height:0}
  .vault .top{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--hair);background:var(--ink)}
  .vault .top .back{background:none;border:1px solid var(--hair-strong);color:var(--bone);border-radius:6px;padding:7px 12px;font-family:var(--sans);font-size:12px;cursor:pointer}
  .vault .top .back:hover{border-color:var(--bone-mute)}
  .vault .top h3{margin:0;font-size:14px;font-weight:500}
  .vault .top h3 small{font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);margin-left:12px;letter-spacing:.06em}
  .vault .top input{margin-left:auto;background:var(--ink-2);border:1px solid var(--hair);border-radius:6px;padding:7px 12px;color:var(--bone);font-family:var(--mono);font-size:11px;width:260px;outline:none}
  .vault .top input:focus{border-color:var(--azure-light)}
  .vault .gfull{grid-column:2;grid-row:2;position:relative;display:none;background:#07070a;min-width:0;min-height:0;overflow:hidden}
  body.graph-full .vault .gfull{display:block} body.graph-full .vault .note{display:none}
  #vgf{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  .gbar{position:absolute;left:16px;top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;z-index:2;pointer-events:none}
  .gbar>*{pointer-events:auto}
  .gbar .seg{display:flex;border:1px solid var(--hair-strong);border-radius:8px;overflow:hidden;background:rgba(17,17,20,.85);backdrop-filter:blur(8px)}
  .gbar button{background:none;border:0;color:var(--bone-dim);font-family:var(--sans);font-size:11.5px;padding:7px 13px;cursor:pointer}
  .gbar button.on{background:#2a2c36;color:#fff}
  .gbar .cnt{font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);background:rgba(17,17,20,.7);padding:5px 9px;border-radius:6px}
  .gpbtn{position:absolute;right:14px;top:14px;z-index:3;width:32px;height:32px;border-radius:8px;border:1px solid var(--hair-strong);background:rgba(17,17,20,.85);color:var(--bone-dim);cursor:pointer;font-size:15px;backdrop-filter:blur(8px)}
  .gpbtn:hover{color:#fff}
  .gpanel{position:absolute;right:14px;top:54px;width:236px;max-height:calc(100% - 70px);overflow:auto;background:rgba(15,15,19,.9);backdrop-filter:blur(12px);border:1px solid var(--hair-strong);border-radius:12px;font-size:12px;z-index:2;box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .gpanel.shut{display:none}
  .gpanel details+details{border-top:1px solid var(--hair)}
  .gpanel summary{padding:11px 14px;cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-mute);list-style:none}
  .gpanel summary::before{content:"›";display:inline-block;width:12px;transition:transform .15s} .gpanel details[open]>summary::before{transform:rotate(90deg)}
  .gpanel .gp{padding:2px 14px 12px;display:grid;gap:9px}
  .gpanel input[type=search]{width:100%;box-sizing:border-box;background:var(--ink-2);border:1px solid var(--hair);border-radius:6px;padding:7px 10px;color:var(--bone);font-family:var(--mono);font-size:11px;outline:none}
  .gpanel input[type=search]:focus{border-color:#6ea8ff}
  .gpanel .ck{display:flex;gap:8px;align-items:center;color:var(--bone-dim);cursor:pointer} .gpanel .ck input{accent-color:#6ea8ff}
  .gpanel .chips{display:flex;flex-wrap:wrap;gap:6px}
  .gpanel .chip{display:flex;align-items:center;gap:6px;border:1px solid var(--hair);border-radius:999px;padding:4px 10px;font-size:11px;color:var(--bone-dim);cursor:pointer;background:var(--ink)}
  .gpanel .chip i{width:8px;height:8px;border-radius:50%} .gpanel .chip small{color:var(--bone-mute);font-family:var(--mono);font-size:9.5px} .gpanel .chip.off{opacity:.38}
  .gpanel .sl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;color:var(--bone-dim);font-size:11.5px}
  .gpanel .sl b{font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--bone-mute)} .gpanel .sl input{grid-column:1/-1;width:100%;accent-color:#6ea8ff;margin:2px 0 0}
  .gpanel .gbtn{width:100%;background:#2a2c36;color:#fff;border:0;border-radius:7px;padding:8px;font-family:var(--sans);font-size:11.5px;cursor:pointer} .gpanel .gbtn:hover{background:#363948}
  .gtip{position:absolute;pointer-events:none;background:rgba(20,20,26,.96);border:1px solid var(--hair-strong);border-radius:10px;padding:9px 12px;font-size:12px;display:none;z-index:4;max-width:280px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .gtip b{font-weight:500;display:block;margin-bottom:2px} .gtip small{display:block;color:var(--bone-mute);font-family:var(--mono);font-size:10px;margin-bottom:6px;word-break:break-all}
  .gtip span{display:flex;align-items:center;gap:6px;color:var(--bone-dim);font-size:11px} .gtip i{width:8px;height:8px;border-radius:50%}
  .tree{border-right:1px solid var(--hair);padding:14px 10px;overflow:auto;font-size:12.5px;background:var(--ink)}
  .tree .dir{padding:8px 10px 4px;color:var(--bone-mute);font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  .tree .f{padding:6px 10px 6px 20px;border-radius:5px;cursor:pointer;color:var(--bone-dim);font-weight:300;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tree .f:hover{background:var(--ink-2);color:var(--bone)} .tree .f.on{background:var(--ink-3);color:var(--bone);font-weight:400}
  .tree .f i{width:5px;height:5px;border-radius:50%;background:#3a3a42;flex:none} .tree .f.on i{background:var(--azure-light)}
  .tree .f.hidden{display:none}
  .note{overflow:auto;padding:36px 56px}
  .note>div{max-width:820px}
  .note .path{font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);letter-spacing:.06em;margin-bottom:18px}
  .note .fm{background:var(--ink);border:1px solid var(--hair);border-radius:6px;padding:12px 16px;font-family:var(--mono);font-size:11px;color:var(--bone-dim);margin-bottom:28px;line-height:1.7;display:grid;grid-template-columns:auto 1fr;gap:0 16px}
  .note .fm b{color:var(--bone-mute);font-weight:400}
  .md h1{font-size:28px;font-weight:500;margin:0 0 18px;line-height:1.2}
  .md h2{font-size:16px;font-weight:500;margin:30px 0 10px} .md h3{font-size:15px;font-weight:500;margin:22px 0 8px}
  .md p,.md li{font-size:14.5px;font-weight:300;line-height:1.65;color:var(--bone-dim)} .md li{margin:3px 0} .md ul,.md ol{padding-left:22px}
  .md a.wl{color:var(--azure-light);text-decoration:none;border-bottom:1px solid #3d8fff55;cursor:pointer} .md a.wl:hover{border-color:var(--azure-light)} .md a.wl.dead{color:var(--bone-mute);border-color:transparent;cursor:default}
  .md a{color:var(--azure-light)}
  .md code{font-family:var(--mono);font-size:12px;background:var(--ink-3);padding:1px 6px;border-radius:4px;color:var(--bone-dim)}
  .md pre{background:var(--ink);border:1px solid var(--hair);border-radius:6px;padding:14px 16px;overflow:auto} .md pre code{background:none;padding:0;font-size:12px;line-height:1.55}
  .md table{border-collapse:collapse;width:100%;font-size:13px;font-weight:300;margin:10px 0}
  .md th{text-align:left;font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);font-weight:400;letter-spacing:.08em;padding:8px 10px;border-bottom:1px solid var(--hair-strong)}
  .md td{padding:9px 10px;border-bottom:1px solid var(--hair);vertical-align:top}
  .md blockquote{margin:12px 0;padding:4px 16px;border-left:2px solid var(--azure);color:var(--bone-dim)}
  .md hr{border:0;border-top:1px solid var(--hair);margin:24px 0}
  /* ---- leitor estilo Obsidian: árvore, nota, propriedades ---- */
  .tree{padding:0 0 18px;background:#0c0c0f}
  .tree .tbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#0c0c0f;border-bottom:1px solid var(--hair);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-mute)}
  .tree .tbar button{background:none;border:0;color:var(--bone-mute);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer} .tree .tbar button:hover{color:#fff}
  .tree .grp.empty{display:none}
  .tree .dir{display:flex;align-items:center;gap:7px;margin:0;padding:8px 14px 6px;cursor:pointer;user-select:none;text-transform:none;letter-spacing:.02em;font-size:11px;color:var(--bone-dim)}
  .tree .dir:hover{color:#fff} .tree .dir span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tree .dir small{font-family:var(--mono);font-size:9.5px;color:var(--bone-mute);background:#17171c;border-radius:9px;padding:1px 7px}
  .tree .chev{width:6px;height:6px;border-right:1.5px solid var(--bone-mute);border-bottom:1.5px solid var(--bone-mute);transform:rotate(45deg);transition:transform .15s;flex:none;margin-right:3px}
  .tree .grp.shut:not(.x) .chev{transform:rotate(-45deg)} .tree .grp.shut .items{display:none} .tree.searching .grp.shut .items{display:block}
  .tree .f{margin:1px 8px;padding:5px 10px 5px 26px;border-radius:6px;position:relative;font-size:12.5px}
  .tree .f i{position:absolute;left:12px;top:50%;margin-top:-3px;width:6px;height:6px;border-radius:50%;opacity:.75}
  .tree .f.on{background:#1b1d27;color:#fff;box-shadow:inset 2px 0 0 #6ea8ff} .tree .f.on i{opacity:1;background:#6ea8ff!important}
  .note{padding:0;background:radial-gradient(1200px 500px at 40% -10%,#13141b 0%,#0a0a0d 60%)}
  .note article{max-width:780px;margin:0 auto;padding:44px 56px 90px}
  .note .path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--bone-mute);letter-spacing:.04em;margin-bottom:16px}
  .note .path i{width:8px;height:8px;border-radius:50%} .note .path em{font-style:normal;opacity:.5}
  .note .pills{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 26px}
  .note .pill{font-family:var(--mono);font-size:10.5px;padding:3px 10px;border-radius:999px;background:#17181f;border:1px solid var(--hair);color:var(--bone-dim)}
  .note .pill.tag{color:#9db8ff;border-color:#27304a;background:#12151f} .note .pill.dim{opacity:.7}
  .note .pill.st-active,.note .pill.st-living{color:#5fd3a5;border-color:#1f4a3b;background:#0f1b17} .note .pill.st-pending,.note .pill.st-draft{color:#f2c14e;border-color:#4a3c1a;background:#1b160c}
  .note .props{margin-top:42px;border-top:1px solid var(--hair);padding-top:12px} .note .props summary{cursor:pointer;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--bone-mute);margin-bottom:12px}
  .note .props .fm{margin:0}
  .md h1{font-size:32px;letter-spacing:-.01em;margin:0 0 20px}
  .md h2{font-size:19px;margin:38px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--hair)} .md h3{font-size:15.5px;color:#e6e8ee}
  .md p,.md li{font-size:15px;line-height:1.75;color:#c9cdd6}
  .md a.wl{background:#13172a;border:0;border-radius:5px;padding:1px 6px;color:#8fb2ff} .md a.wl:hover{background:#1a2040;color:#b3c9ff} .md a.wl.dead{background:transparent;color:var(--bone-mute);padding:0}
  .md blockquote{background:#10131c;border-left:3px solid #6ea8ff;border-radius:0 8px 8px 0;padding:8px 18px}
  .md code{background:#16181f;color:#b9c2d6} .md pre{background:#0d0e13;border-radius:10px}
  .md table{border:1px solid var(--hair);border-radius:8px;overflow:hidden} .md tr:nth-child(even) td{background:#0e0f14}
  .md ul li::marker{color:#6ea8ff}
  .md strong{font-weight:500;color:var(--bone)}
  .side{border-left:1px solid var(--hair);display:flex;flex-direction:column;background:var(--ink);min-height:0}
  .side .kicker{padding:16px 18px 8px}
  #vg{position:static;width:100%;height:260px;cursor:default;border-bottom:1px solid var(--hair);display:block}

<script>
/* ===================== ESTADO ===================== */
let S=null;                       // último estado do servidor
const nodes=new Map();            // id → nó (posição persistente)
let links=[];
const parts=[];                   // partículas viajando
let hub=null,sel=null,hoverN=null;
const view={x:0,y:0,k:1};
const BOLT=[[69.84,0],[0,78.66],[36.76,79.39],[11.76,135.26],[83.81,60.28],[43.37,58.81]];

const cv=document.getElementById('c'),ctx=cv.getContext('2d',{alpha:false});   // canvas opaco: o fundo é pintado a cada quadro, o compositor não mistura com o body
// escrita no DOM só quando o valor muda — a atualização de 1 s não repinta a barra do topo à toa
const setTxt=(el,v)=>{v=String(v);if(el.textContent!==v)el.textContent=v;};
const setAttr=(el,k,v)=>{if(el.getAttribute(k)!==v)el.setAttribute(k,v);};
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){const w=innerWidth,h=innerHeight;if(w===W&&h===H)return false;W=w;H=h;DPR=Math.min(devicePixelRatio||1,2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);if(!hub){view.x=W*0.46;view.y=H*0.52;}return true;}
addEventListener('resize',()=>{resize();});

/* ===================== MODELO → GRAFO ===================== */
let VIEW='ativas';try{VIEW=localStorage.getItem('salaView')==='ativas'?'ativas':(localStorage.getItem('salaView')?'todas':'ativas');}catch{}
function sessionsOf(p){return S.sessions.filter(s=>s.project===p.path&&!s.is_sala&&(VIEW!=='ativas'||s.recent));}
function setView(v){VIEW=v;try{localStorage.setItem('salaView',v);}catch{}document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));SIM.full=true;rebuild();fitAll();}
document.getElementById('vw').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v);});
document.getElementById('emptyv').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.v);});
document.querySelectorAll('#vw button').forEach(b=>b.classList.toggle('on',b.dataset.v===VIEW));
// Rede neural com física: cada negócio puxa os seus projetos para o próprio setor (força suave, não leque rígido),
// sessões e agentes ficam presos por mola ao pai e levemente empurrados para fora. A colisão usa a caixa do nó +
// rótulo horizontal, e o rótulo vai para o lado (direita, esquerda, baixo, cima) com mais espaço livre.
// A simulação esfria e para; só reaquece, de leve, quando entra ou sai nó. Posições iniciais vêm de um hash do id.
const LY={R1:240,sig:1};
const SIM={alpha:0,min:0.004,decay:0.028,ticks:0,arr:[],full:true};
const PREV=new Map();let armedAt=performance.now()+3500;   // estados anteriores (para a câmera automática)
function bizOf(p){return p.kind==='ct'?'Centro de Treinamento':(p.business||p.name);}
function hsh(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)/4294967296;}
function rebuild(){
  if(!S)return;
  const keep=new Set();let added=0;
  const get=(id,init,x,y)=>{let n=nodes.get(id);if(!n){n=Object.assign({id,x,y,vx:0,vy:0,pulse:0,glow:0,phase:hsh(id+'#')*6.28,side:null},init);nodes.set(id,n);added++;}else Object.assign(n,init);keep.add(id);return n;};
  const salaSess=S.sessions.find(s=>s.is_sala);
  hub=get('hub',{kind:'hub',r:34,fixed:true,sess:salaSess||null},0,0);hub.x=hub.y=0;
  const projs=S.projects.filter(p=>p.kind!=='sala'&&sessionsOf(p).length).sort((a,b)=>(bizOf(a)==='Centro de Treinamento')-(bizOf(b)==='Centro de Treinamento')||bizOf(a).localeCompare(bizOf(b))||a.name.localeCompare(b.name));
  // setor de cada negócio: fatia proporcional ao nº de folhas (sessão sem agente ou agente) — só semente e âncora
  const groups=[];projs.forEach(p=>{const b=bizOf(p);let g=groups[groups.length-1];if(!g||g.name!==b){g={name:b,ps:[]};groups.push(g);}
    const ss=sessionsOf(p).sort((x,y)=>(x.name||'').localeCompare(y.name||'')||x.id.localeCompare(y.id));g.ps.push({p,ss,w:ss.reduce((a,s)=>a+Math.max(1,s.agents.length),0)});});
  const GAP_B=groups.length>1?1.5:0,U=Math.max(6,groups.reduce((a,g)=>a+g.ps.reduce((b,x)=>b+x.w+0.6,0)+GAP_B,0)),u=Math.PI*2/U;
  LY.R1=Math.max(230,projs.length*140/(Math.PI*2),U*30/(Math.PI*2));
  let a=-Math.PI/2+GAP_B*u/2;
  groups.forEach(g=>{const a0=a,members=[];
    g.ps.forEach(({p,ss,w})=>{const seed=a+(w+0.6)*u/2;a+=(w+0.6)*u;
      const L=get('p:'+p.path,{kind:'lead',r:15,proj:p,biz:g.name,seed,sess:ss},Math.cos(seed)*LY.R1,Math.sin(seed)*LY.R1);members.push(L);L.wires=[hub];
      ss.forEach((sx,i)=>{const sa=Math.atan2(L.y,L.x)+(i-(ss.length-1)/2)*0.45,sl=sx.stopped?78:96;
        const SN=get('s:'+sx.id,{kind:'session',r:sx.stopped?7:11,sess:sx,lead:L,proj:p},L.x+Math.cos(sa)*sl,L.y+Math.sin(sa)*sl);members.push(SN);L.wires.push(SN);SN.wires=[L];
        const ags=sx.agents.slice().sort((x,y)=>x.name.localeCompare(y.name));
        ags.forEach((ag,j)=>{const aa=Math.atan2(SN.y-L.y,SN.x-L.x)+(j-(ags.length-1)/2)*0.55;
          const A=get('a:'+sx.id+'/'+ag.name,{kind:'agent',r:9,ag,sess:sx,lead:SN,proj:L},SN.x+Math.cos(aa)*74,SN.y+Math.sin(aa)*74);members.push(A);SN.wires.push(A);A.wires=[SN];});});});
    const seed=(a0+a)/2;get('b:'+g.name,{kind:'biz',r:0,name:g.name,seed,members,side:'c',wires:[]},Math.cos(seed)*LY.R1*1.9,Math.sin(seed)*LY.R1*1.9);a+=GAP_B*u;});
  hub.wires=[];let removed=0;
  for(const id of [...nodes.keys()])if(!keep.has(id)){nodes.delete(id);removed++;}
  SIM.arr=[...nodes.values()];
  // rótulos e física
  if(SIM.full){SIM.full=false;LY.sig=1;SIM.arr.forEach(measure);chooseSides(SIM.arr,true);SIM.alpha=1;warm(400);
    LY.sig=1/Math.min(1,Math.max(0.72,overview().k));SIM.arr.forEach(measure);chooseSides(SIM.arr,true);SIM.alpha=0.4;warm(400);}
  else{let grew=false;SIM.arr.forEach(n=>{const w=n.lw;measure(n);if(w!=null&&Math.abs(w-n.lw)>2)grew=true;});
    if(added||removed){SIM.arr.filter(n=>!n.side).forEach(n=>chooseSides([n],true,SIM.arr));SIM.arr.forEach(n=>n.box=nbox(n));SIM.alpha=Math.max(SIM.alpha,0.3);}
    else if(grew){SIM.arr.forEach(n=>n.box=nbox(n));SIM.alpha=Math.max(SIM.alpha,0.05);}
    if(RM.matches)warm(600);}
  // câmera automática: sessão que passa a trabalhar / precisar de você, agente que começa, manda mensagem ou conclui
  const armed=performance.now()>armedAt;
  for(const n of nodes.values()){
    const cur=n.kind==='session'?stateOfSession(n.sess):n.kind==='agent'?n.ag.state:null;if(cur==null)continue;
    const prev=PREV.get(n.id);PREV.set(n.id,cur);
    if(armed&&prev!==cur&&(cur==='active'||cur==='approval'||cur==='done'||cur==='waiting')&&(prev!==undefined||cur==='active'))camFocus(n);}
  document.getElementById('emptyv').classList.toggle('on',VIEW==='ativas'&&!projs.length);
  setTxt(vA,S.counts.recent||0);setTxt(vO,S.counts.sessions||0);
  links=[];for(const n of nodes.values()){if(n.kind==='lead')links.push({a:hub,b:n});if(n.kind==='session')links.push({a:n.lead,b:n});if(n.kind==='agent')links.push({a:n.lead,b:n});}
  if(sel&&!nodes.has(sel.id)){closeDrawer();}else if(sel){sel=nodes.get(sel.id);renderDrawer(sel);}
}
// texto do rótulo de cada nó: [nome, linha de baixo usada na medida, tamanho, largura máxima]
function ltext(n){if(n.kind==='lead')return [projShort(n.proj.name,n.biz),(n.sess.length+(n.sess.length===1?' sessão':' sessões')).toUpperCase(),12,118];
  if(n.kind==='session')return [shortName(n.sess.name),'PARADA',n.sess.stopped?9.5:10.5,135];
  if(n.kind==='agent')return [n.ag.name,(n.ag.type||n.ag.kind||'').toUpperCase(),10.5,135];return null;}
const bizFont=()=>`500 ${(11*(LY.sig||1)).toFixed(1)}px "IBM Plex Mono",Menlo,monospace`;
function measure(n){const g=LY.sig||1;if(n.kind==='biz'){const f=bizFont();ctx.font=f;n.lw=ctx.measureText(ell(n.name.toUpperCase(),220*g,f)).width+12;n.lh=16*g;}
  else{const t=ltext(n);if(!t){n.lw=n.lh=0;}else{n.lw=labelW(t[0],t[1],t[2],t[3])+4;n.lh=t[2]*g+13*g;}}n.box=nbox(n);}
// retângulo do rótulo (relativo ao centro do nó) para um lado: r, l, d, u
function lrect(n,side){const w=n.lw||0,h=n.lh||0,o=n.r+5;side=side||n.side||'r';
  if(n.kind==='biz')return {x:-w/2,y:-h/2,w,h};
  return side==='r'?{x:o,y:-h/2,w,h}:side==='l'?{x:-o-w,y:-h/2,w,h}:side==='d'?{x:-w/2,y:o,w,h}:{x:-w/2,y:-o-h,w,h};}
// caixa de colisão = nó + rótulo
function nbox(n){if(n.kind==='hub')return {x0:-64,y0:-n.r-10,x1:64,y1:n.r+46};
  const R=lrect(n);if(n.kind==='biz')return {x0:R.x,y0:R.y,x1:R.x+R.w,y1:R.y+R.h};const p=n.r+4;
  return {x0:Math.min(-p,R.x),y0:Math.min(-p,R.y),x1:Math.max(p,R.x+R.w),y1:Math.max(p,R.y+R.h)};}
const ovA=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
function segHits(R,x1,y1,x2,y2){for(let i=1;i<12;i++){const t=i/12,x=x1+(x2-x1)*t,y=y1+(y2-y1)*t;if(x>R.x&&x<R.x+R.w&&y>R.y&&y<R.y+R.h)return true;}return false;}
// lado do rótulo: o de menos sobreposição com nós, rótulos e fios; preferência pelo lado de fora; histerese para não trocar à toa
function chooseSides(list,force,all){all=all||list;
  for(const n of list){if(n.kind==='hub'||n.kind==='biz'){n.box=nbox(n);continue;}
    const p=n.kind==='lead'?hub:n.lead;let dx=n.x-p.x,dy=n.y-p.y;if(n.kind==='lead'){const t=dx;dx=-dy;dy=t;}   // projeto: rótulo de lado (fio entra por dentro, sessões saem por fora)
    const order=Math.abs(dx)>=Math.abs(dy)*0.7?(dx>=0?['r','l','d','u']:['l','r','d','u']):(dy>=0?['d','u','r','l']:['u','d','r','l']);
    let best=n.side||order[0],bs=1e18;
    for(let i=0;i<4;i++){const s=order[i],r=lrect(n,s),R={x:n.x+r.x,y:n.y+r.y,w:r.w,h:r.h};let sc=i*15;
      for(const m of all){if(m===n)continue;
        sc+=3*ovA(R,m.kind==='hub'?{x:m.x-64,y:m.y-m.r-10,w:128,h:2*m.r+56}:{x:m.x-m.r-4,y:m.y-m.r-4,w:2*m.r+8,h:2*m.r+8});
        if(m.side&&m.kind!=='hub'){const q=lrect(m);sc+=ovA(R,{x:m.x+q.x,y:m.y+q.y,w:q.w,h:q.h});}}
      for(const o of n.wires||[])if(segHits(R,n.x,n.y,o.x,o.y))sc+=900;
      if(!force&&s===n.side)sc-=60;
      if(sc<bs){bs=sc;best=s;}}
    n.side=best;n.box=nbox(n);}}
// colisão por caixa (nó + rótulo); projeto pesa mais, nome do negócio cede mais
const wOf=n=>n.fixed?0:n.kind==='lead'?0.4:n.kind==='biz'?2:1;
function collide(arr,str){for(let i=0;i<arr.length;i++){const a=arr[i];for(let j=i+1;j<arr.length;j++){const b=arr[j];const wa=wOf(a),wb=wOf(b);if(!wa&&!wb)continue;
  const A=a.box,B=b.box;if(!A||!B)continue;const m=6,ox=Math.min(a.x+A.x1,b.x+B.x1)-Math.max(a.x+A.x0,b.x+B.x0)+m,oy=Math.min(a.y+A.y1,b.y+B.y1)-Math.max(a.y+A.y0,b.y+B.y0)+m;
  if(ox<=0||oy<=0)continue;const sa=wa/(wa+wb),sb=wb/(wa+wb);
  if(ox<oy){const d=(b.x+(B.x0+B.x1)/2)-(a.x+(A.x0+A.x1)/2)>=0?1:-1;a.x-=d*ox*str*sa;b.x+=d*ox*str*sb;}
  else{const d=(b.y+(B.y0+B.y1)/2)-(a.y+(A.y0+A.y1)/2)>=0?1:-1;a.y-=d*oy*str*sa;b.y+=d*oy*str*sb;}}}}
function tick(){
  const al=SIM.alpha,arr=SIM.arr;
  for(const n of arr){if(n.fixed)continue;let tx,ty,st;
    if(n.kind==='lead'){tx=Math.cos(n.seed)*LY.R1;ty=Math.sin(n.seed)*LY.R1;st=0.06;}            // atração para o setor do negócio
    else if(n.kind==='biz'){let R=0;for(const m of n.members)R=Math.max(R,Math.hypot(m.x,m.y)+m.r);tx=Math.cos(n.seed)*(R+50);ty=Math.sin(n.seed)*(R+50);st=0.1;}
    else{const p=n.lead,q=n.kind==='session'?hub:p.lead;let ux=p.x-q.x,uy=p.y-q.y;const d=Math.hypot(ux,uy)||1,len=n.kind==='session'?(n.sess.stopped?78:96):74;
      tx=p.x+ux/d*len;ty=p.y+uy/d*len;st=0.04;                                                      // leve empurrão para fora do pai
      const dx=n.x-p.x,dy=n.y-p.y,dd=Math.hypot(dx,dy)||1,f=(dd-len)/dd*0.3*al;n.vx-=dx*f*0.85;n.vy-=dy*f*0.85;if(!p.fixed){p.vx+=dx*f*0.15;p.vy+=dy*f*0.15;}}
    n.vx+=(tx-n.x)*st*al;n.vy+=(ty-n.y)*st*al;}
  for(let i=0;i<arr.length;i++){const a=arr[i];for(let j=i+1;j<arr.length;j++){const b=arr[j];const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy;if(d2>90000)continue;
    const f=700*al/Math.max(d2,400);if(!a.fixed){a.vx-=dx*f/Math.sqrt(Math.max(d2,1));a.vy-=dy*f/Math.sqrt(Math.max(d2,1));}if(!b.fixed){b.vx+=dx*f/Math.sqrt(Math.max(d2,1));b.vy+=dy*f/Math.sqrt(Math.max(d2,1));}}}
  for(const n of arr){if(n.fixed){n.vx=n.vy=0;continue;}n.vx*=0.6;n.vy*=0.6;n.x+=n.vx;n.y+=n.vy;}
  collide(arr,0.5);
  if(++SIM.ticks%12===0&&al>0.06)chooseSides(arr,false);
  SIM.alpha-=SIM.alpha*SIM.decay;if(SIM.alpha<SIM.min)SIM.alpha=0;}
function warm(n){for(let i=0;i<n&&SIM.alpha>0;i++)tick();}

/* ===================== INTERAÇÃO + CÂMERA ===================== */
// Câmera = centro no mundo + zoom, sempre com easing (corte seco com prefers-reduced-motion).
// Automática: enquadra o que acabou de ativar e segura FOCUS_HOLD; sem atividade volta devagar à visão geral.
// Mexeu na mão (roda, pinça, arrastar): pausa CAM_PAUSE ou até clicar em "auto".
const RM=matchMedia('(prefers-reduced-motion: reduce)');
const FOCUS_HOLD=6000,CAM_PAUSE=20000;
const cam={cx:0,cy:0,k:1},camT={cx:0,cy:0,k:1};let camTau=330,camInit=false,camPause=0,camAuto=true,focusQ=[];
try{camAuto=localStorage.getItem('salaCam')!=='off';}catch{}
let pan=null,moved=false,down=null,mouse={x:-1e9,y:-1e9},downNode=null;
const availW=()=>document.body.classList.contains('open')?W-380:W;
const scr0=()=>({x:availW()/2,y:56+(H-56)/2});
function syncView(){const c=scr0();view.k=cam.k;view.x=c.x-cam.cx*cam.k;view.y=c.y-cam.cy*cam.k;}
const toWorld=(px,py)=>({x:(px-view.x)/view.k,y:(py-view.y)/view.k});
function pick(px,py){const p=toWorld(px,py);const arr=[...nodes.values()];for(let i=arr.length-1;i>=0;i--){const n=arr[i];if(n.kind!=='biz'&&Math.hypot(p.x-n.x,p.y-n.y)<n.r+9/view.k)return n;}return null;}
// enquadra nós (caixa do nó + rótulo) dentro da área livre
function fitOf(list,kmin,kmax){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  list.forEach(n=>{const b=n.box||{x0:-n.r,y0:-n.r,x1:n.r,y1:n.r};add(n.x+b.x0,n.y+b.y0);add(n.x+b.x1,n.y+b.y1);});
  if(x0>x1)return {cx:0,cy:0,k:1};const pad=60,aw=availW()-pad*2,ah=H-56-pad*2;
  return {cx:(x0+x1)/2,cy:(y0+y1)/2,k:Math.min(kmax,Math.max(kmin,Math.min(aw/Math.max(1,x1-x0),ah/Math.max(1,y1-y0))))};}
function overview(){return fitOf([...nodes.values()],0.15,1.4);}
function fitAll(){Object.assign(camT,overview());camTau=330;if(!camInit){Object.assign(cam,camT);camInit=true;}}
function camFocus(n){if(!n||n.kind==='hub')return;focusQ.push({id:n.id,t:performance.now()});}
function manual(){Object.assign(camT,cam);if(camAuto)camPause=performance.now()+CAM_PAUSE;updCamBtn();}
function camStep(dt,now){
  if(camAuto&&camInit&&now>camPause){focusQ=focusQ.filter(f=>now-f.t<FOCUS_HOLD&&nodes.has(f.id));
    if(focusQ.length){const set=new Set();focusQ.forEach(f=>{const n=nodes.get(f.id);set.add(n);if(n.lead&&n.lead.kind!=='hub')set.add(n.lead);});
      Object.assign(camT,fitOf([...set],Math.min(0.9,overview().k),1.5));camTau=330;}
    else{Object.assign(camT,overview());camTau=1100;}}
  if(RM.matches||!camInit)Object.assign(cam,camT);
  else{const a=1-Math.exp(-dt/camTau);cam.cx+=(camT.cx-cam.cx)*a;cam.cy+=(camT.cy-cam.cy)*a;cam.k=Math.exp(Math.log(cam.k)+(Math.log(camT.k)-Math.log(cam.k))*a);}
  syncView();if(now-lastBtn>1000){lastBtn=now;updCamBtn();}}
let lastBtn=0;
function updCamBtn(){const b=document.getElementById('camAuto');if(!b)return;const left=Math.ceil((camPause-performance.now())/1000);
  b.classList.toggle('on',camAuto&&left<=0);setTxt(b.querySelector('em'),!camAuto?'off':left>0?'pausa '+left+'s':'on');
  setAttr(b,'title',!camAuto?'câmera automática desligada — clique para ligar':left>0?'você mexeu no mapa: a câmera automática volta em '+left+'s (clique para voltar já)':'câmera automática: segue o que ativa e volta à visão geral — clique para desligar');}
document.getElementById('camAuto').addEventListener('click',()=>{if(camAuto&&camPause>performance.now())camPause=0;else camAuto=!camAuto;camPause=0;try{localStorage.setItem('salaCam',camAuto?'on':'off');}catch{}updCamBtn();});
document.getElementById('camFit').addEventListener('click',()=>{camPause=0;focusQ=[];fitAll();updCamBtn();});
function zoomAt(px,py,k){k=Math.min(3,Math.max(0.12,k));const p=toWorld(px,py),c=scr0();cam.k=k;cam.cx=p.x-(px-c.x)/k;cam.cy=p.y-(py-c.y)/k;syncView();manual();}
cv.addEventListener('pointerdown',e=>{if(e.button!==0)return;cv.setPointerCapture(e.pointerId);moved=false;down={x:e.clientX,y:e.clientY};downNode=pick(e.clientX,e.clientY);pan={x:e.clientX,y:e.clientY,cx:cam.cx,cy:cam.cy};});
cv.addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY};if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>4)moved=true;
  if(pan&&moved){cam.cx=pan.cx-(e.clientX-pan.x)/cam.k;cam.cy=pan.cy-(e.clientY-pan.y)/cam.k;syncView();manual();}});
function up(){if(downNode&&!moved)open(downNode);downNode=null;pan=null;down=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',()=>{pan=null;down=null;downNode=null;});

let fitted=false;
// roda do mouse = zoom; pinça do trackpad chega como wheel + ctrlKey (Chrome/Firefox) ou gesture* (Safari)
cv.addEventListener('wheel',e=>{e.preventDefault();const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomAt(e.clientX,e.clientY,cam.k*Math.exp(-dy*(e.ctrlKey?0.012:0.0016)));},{passive:false});
let gK=1;cv.addEventListener('gesturestart',e=>{e.preventDefault();gK=cam.k;});

const fmtTok=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(n>=1e8?0:1)+'M':n>=1e3?Math.round(n/1e3)+'k':String(Math.round(n||0));
const TK_COL={ok:'#8F948D',warn:'#e5b94a',high:'#e5604a'};
const TK_WORD={ok:'contexto saudável',warn:'contexto grande — vale compactar',high:'contexto enorme — compacte ou abra sessão nova'};
const CTX_MAX=1e6;
const COL={bone:'#F2F3F0',dim:'#C4C8C1',mute:'#8F948D',az:'#3d8fff',azg:'#5b6bff',amber:'#3d8fff',ok:'#3fbf7a',off:'#585C57'};
function stateOfSession(s){if(s.state==='blocked'||s.agents.some(a=>a.state==='approval'))return 'approval';if(s.status==='busy'||s.agents.some(a=>a.state==='active'))return 'active';return 'idle';}
function stateOfLead(L){if(!L.sess.length)return 'off';const ags=L.sess.flatMap(s=>s.agents);if(ags.some(a=>a.state==='approval')||L.sess.some(s=>s.state==='blocked'))return 'approval';if(ags.some(a=>a.state==='active')||L.sess.some(s=>s.status==='busy'))return 'active';return 'idle';}
function colorOf(st){return st==='approval'?COL.amber:st==='active'?COL.bone:st==='done'?COL.ok:st==='waiting'?COL.dim:COL.mute;}
function agentFade(ag){const age=ag.age==null?0:ag.age;if(ag.state==='active'||ag.state==='approval')return 1;if(ag.state==='done')return Math.max(0.35,1-age/300*0.65);return Math.max(0.3,1-Math.max(0,age-60)/600);}
function halo(x,y,r,color,alpha){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(0,0,0,0)');const a=ctx.globalAlpha;ctx.globalAlpha=a*(alpha||0.35);ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.globalAlpha=a;}

function text(t,x,y,size,col,w,al,fam){ctx.font=`${w||400} ${size}px ${fam==='mono'?'"IBM Plex Mono",Menlo,monospace':'Montserrat,system-ui,sans-serif'}`;ctx.fillStyle=col;ctx.textAlign=al||'center';ctx.fillText(t,x,y);}
// rótulo horizontal no lado escolhido pela física, fundo escuro por cima dos fios,
// nome truncado com reticências (o completo vem no hover)
const ELL=new Map();
function ell(t,max,font){t=String(t||'');const key=font+'|'+max+'|'+t;let v=ELL.get(key);if(v!=null)return v;ctx.font=font;v=t;
  if(ctx.measureText(t).width>max){let lo=0,hi=t.length;while(lo<hi){const m=(lo+hi+1)>>1;if(ctx.measureText(t.slice(0,m)+'…').width<=max)lo=m;else hi=m-1;}v=t.slice(0,lo).trimEnd()+'…';}
  if(ELL.size>4000)ELL.clear();ELL.set(key,v);return v;}
const lfonts=s1=>{const g=LY.sig||1;return [`500 ${(s1*g).toFixed(1)}px Montserrat,system-ui,sans-serif`,`400 ${(7.5*g).toFixed(1)}px "IBM Plex Mono",Menlo,monospace`];};
function labelW(l1,l2,s1,max){const g=LY.sig||1,[f1,f2]=lfonts(s1);ctx.font=f1;let w=ctx.measureText(ell(l1,max*g,f1)).width;if(l2){ctx.font=f2;w=Math.max(w,ctx.measureText(ell(l2,max*g,f2)).width);}return w+4;}
function hlabel(n,l1,l2,c1,c2,s1,max,alpha){
  const g=LY.sig||1,[f1,f2]=lfonts(s1),r=lrect(n),x=n.x+r.x,y=n.y+r.y,S1=s1*g;max*=g;
  ctx.save();ctx.globalAlpha=alpha==null?1:alpha;ctx.fillStyle='rgba(9,10,8,0.8)';ctx.fillRect(x,y,r.w,r.h);
  const al=n.side==='l'?'right':n.side==='r'?'left':'center',tx=al==='left'?x+4:al==='right'?x+r.w-4:x+r.w/2;ctx.textAlign=al;
  ctx.font=f1;ctx.fillStyle=c1;ctx.fillText(ell(l1,max,f1),tx,y+S1);if(l2){ctx.font=f2;ctx.fillStyle=c2;ctx.fillText(ell(l2,max,f2),tx,y+S1+1+9.5*g);}ctx.restore();}
// fio levemente curvo: ponto de controle simétrico (o mesmo nos dois sentidos), lado da curva pelo hash do par
function ctrlPt(a,b){const s=a.id<b.id,p=s?a:b,q=s?b:a,bend=(hsh(p.id+'~'+q.id)<0.5?-1:1)*0.12;return {x:(p.x+q.x)/2-(q.y-p.y)*bend,y:(p.y+q.y)/2+(q.x-p.x)*bend};}
function curvePt(a,b,t){const c=ctrlPt(a,b),u=1-t;return {x:u*u*a.x+2*u*t*c.x+t*t*b.x,y:u*u*a.y+2*u*t*c.y+t*t*b.y};}
function wire(a,b){const c=ctrlPt(a,b);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo(c.x,c.y,b.x,b.y);ctx.stroke();}
function projShort(name,biz){return biz&&name.startsWith(biz+' | ')?name.slice(biz.length+3):name;}
function shortName(s){const parts=s.split(' | ');return parts.length>2?parts.slice(2).join(' | '):parts.length===2?parts[1]:s;}
let tPrev=performance.now();
function frame(now){
  const dt=Math.min(40,now-tPrev);tPrev=now;const T=now/1000;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#090A08';ctx.fillRect(0,0,W,H);
  if(!hub){requestAnimationFrame(frame);return;}
  const LBL=[];   // rótulos desenhados por último, por cima de fios e nós
  if(SIM.alpha>0){if(RM.matches)warm(600);else{tick();if(SIM.alpha>0.3)tick();}}camStep(dt,now);
  ctx.setTransform(DPR*view.k,0,0,DPR*view.k,DPR*view.x,DPR*view.y);
  const hov=!(pan&&moved)?pick(mouse.x,mouse.y):null;hoverN=hov;cv.style.cursor=pan&&moved?'grabbing':hov?'pointer':'grab';

  for(const B of nodes.values()){if(B.kind!=='biz')continue;LBL.push(()=>{ctx.save();const f=bizFont();ctx.font=f;ctx.fillStyle=COL.mute;ctx.textAlign='center';ctx.globalAlpha=0.9;ctx.fillText(ell(B.name.toUpperCase(),220*(LY.sig||1),f),B.x,B.y+4*(LY.sig||1));ctx.restore();});}

    if(on){ctx.strokeStyle='rgba(91,107,255,0.35)';ctx.setLineDash([1.5,14]);ctx.lineDashOffset=-(T*28)%16;wire(l.a,l.b);ctx.setLineDash([]);}ctx.globalAlpha=1;});

  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=p.speed*dt/16;const col=p.kind==='approval'?COL.amber:p.kind==='done'?COL.ok:p.kind==='dispatch'?COL.az:COL.bone;
    for(let k=5;k>=0;k--){const tt=Math.max(0,Math.min(1,p.t-k*0.02));ctx.globalAlpha=k?0.10*(6-k)/6:1;const q=curvePt(p.a,p.b,tt);circ(q.x,q.y,k?2.6:3.4,col,null,0,k?null:col,14);}ctx.globalAlpha=1;
    if(p.t>=1){parts.splice(i,1);p.b.glow=1;p.b.pulse=1;}}
  // hub — marca JG
  hub.pulse=Math.max(0,hub.pulse-dt/900);hub.glow=Math.max(0,hub.glow-dt/900);
  const hubOn=hub.sess&&hub.sess.status==='busy';
  circ(hub.x,hub.y,hub.r+hub.pulse*6,'#131412','#2A2D29',1.5,(hub.glow||hubOn)?COL.azg:null,34+hub.pulse*30);
  ctx.strokeStyle=COL.az;ctx.globalAlpha=0.25+0.25*Math.sin(T*1.6);ctx.lineWidth=1;ctx.beginPath();ctx.arc(hub.x,hub.y,hub.r+7,T*0.6,T*0.6+4.4);ctx.stroke();ctx.globalAlpha=1;
  halo(hub.x,hub.y,30+hub.pulse*20,COL.az,0.45);ctx.save();const bs=34/136;ctx.translate(hub.x-84.54*bs/2,hub.y-17);ctx.scale(bs,bs);ctx.beginPath();BOLT.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=COL.az;ctx.fill();ctx.restore();
  text('SALA DE CONTROLE',hub.x,hub.y+hub.r+26,9.5,COL.mute,500,'center','mono');
  if(hub.sess&&hub.sess.status==='busy')text('roteando',hub.x,hub.y+hub.r+40,9.5,COL.az,400,'center','mono');
  // líderes (projetos)
  for(const L of nodes.values()){if(L.kind!=='lead')continue;L.pulse=Math.max(0,L.pulse-dt/900);L.glow=Math.max(0,L.glow-dt/700);const st=stateOfLead(L),on=st!=='off',col=st==='approval'?COL.amber:st==='active'?COL.bone:on?COL.dim:COL.off;
    if(st==='active'){ctx.strokeStyle=COL.bone;ctx.globalAlpha=0.35;ctx.lineWidth=1;ctx.beginPath();ctx.arc(L.x,L.y,L.r+6,T*0.9,T*0.9+5);ctx.stroke();ctx.globalAlpha=1;}
    if(st==='approval'){ctx.globalAlpha=0.35+0.25*Math.sin(T*3);circ(L.x,L.y,L.r+8,'#3d8fff30');ctx.globalAlpha=1;}
    const isSel=sel===L||hov===L;circ(L.x,L.y,L.r+L.pulse*3,on?'#1C1E1B':'#131412',col,isSel?2.5:1.75,L.glow?col:null,22);
    if(!on){ctx.strokeStyle=COL.off;ctx.setLineDash([3,4]);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(L.x,L.y,L.r,0,6.283);ctx.stroke();ctx.setLineDash([]);}
    const sub=!on?'sem sessão aberta':L.sess.length+(L.sess.length===1?' sessão':' sessões'),nm=projShort(L.proj.name,L.biz);

  for(const SN of nodes.values()){if(SN.kind!=='session')continue;SN.pulse=Math.max(0,SN.pulse-dt/900);SN.glow=Math.max(0,SN.glow-dt/700);const st=stateOfSession(SN.sess),col=st==='approval'?COL.amber:st==='active'?COL.bone:COL.dim,isSel=sel===SN||hov===SN;

    ctx.globalAlpha=fade;circ(SN.x,SN.y,SN.r+SN.pulse*3,'#1C1E1B',SN.sess.stopped?COL.off:col,isSel?2.5:SN.sess.stopped?1.2:1.6,SN.glow?col:null,20);

    else if(s==='approval'){ctx.globalAlpha=0.45+0.3*Math.sin(T*3);circ(A.x,A.y,A.r+6,'#3d8fff40');ctx.globalAlpha=1;circ(A.x,A.y,A.r+A.pulse*2,COL.amber,null,0,COL.amber,18);}

const SUMC=new Map();let hovT=null,hovKey='';
const SUM_ERR={login:'Resumo por IA indisponível: o login do claude no terminal venceu (rode claude e /login).',sem_claude:'Resumo por IA indisponível: comando claude não encontrado.',falhou:'Não deu para resumir agora.'};
function sumKey(sid,agent){return sid+'/'+(agent||'');}  // um resumo por sessão/agente, renovado a cada 1 min no máximo
function sumOf(sid,agent,ep){return SUMC.get(sumKey(sid,agent,ep))||null;}
async function askSum(sid,agent,ep){const k=sumKey(sid,agent);const c=SUMC.get(k);if(c&&(c.st==='wait'||(c.st==='ok'&&(c.ep===ep||Date.now()-c.at<60000))))return;SUMC.set(k,c&&c.st==='ok'?Object.assign({},c,{refreshing:true,st:'ok',at:Date.now()}):{st:'wait'});if(sel)renderDrawer(sel);
  try{const r=await fetch('/api/summary?sid='+encodeURIComponent(sid)+'&agent='+encodeURIComponent(agent||''));const d=await r.json();SUMC.set(k,d.text?{st:'ok',text:d.text,ep,at:Date.now()}:{st:'err',text:SUM_ERR[d.error]||SUM_ERR.falhou,at:Date.now()});}
  catch{SUMC.set(k,{st:'err',text:SUM_ERR.falhou});}if(sel)renderDrawer(sel);}
function mainSess(L){return L.sess.slice().sort((a,b)=>(b.last_epoch||0)-(a.last_epoch||0))[0]||null;}
function hoverAsk(n){/* chave sem última atividade: passar o mouse de novo numa sessão em andamento não refaz o resumo antes de 1 min */let ss=n&&n.kind==='lead'?mainSess(n):n&&n.kind==='hub'?hub.sess:n&&n.kind==='session'?n.sess:null;const t=n&&(n.kind==='agent'?[n.sess.id,n.ag.name,n.ag.last_epoch]:ss?[ss.id,'',ss.last_epoch]:null);const k=t?sumKey(t[0],t[1]):'';
  if(k===hovKey)return;hovKey=k;clearTimeout(hovT);if(t)hovT=setTimeout(()=>askSum(...t),250);}
function aiHtml(c){if(!c)return '';if(c.st==='wait')return '<div class="ai wait">Resumindo…</div>';return `<div class="ai ${c.st==='err'?'err':''}">${esc(c.text)}</div>`;}
function cardHtml(doing,goal,c){return `<div class="doing">${esc(doing||'Sem atividade registrada')}</div>${goal?`<div class="goal">Objetivo: ${esc(goal)}</div>`:''}${aiHtml(c)}`;}
function ago(sec){if(sec==null)return '';if(sec<60)return 'agora';if(sec<3600)return Math.round(sec/60)+' min';if(sec<86400)return Math.round(sec/3600)+' h';return Math.round(sec/86400)+' d';}
function sinceWord(x,st){const g=x.age;if(st==='approval')return 'precisa de você';if(st==='done')return 'concluiu'+(g!=null?' há '+ago(g):'');if(st==='waiting')return 'esperando resposta';if(st==='active')return 'trabalhando'+(g!=null&&g>=60?' · última ação há '+ago(g):'');return g==null?'parada':'parada há '+ago(g);}

const FEED=[];let feedFlashT=null;
addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0);});
function fmtTime(ep){const d=new Date(ep*1000);return d.toTimeString().slice(0,8);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function pushFeed(kind,who,what,where,ep){FEED.push({kind,who,what,where,ep});if(FEED.length>40)FEED.shift();sFeed.textContent=fmtTime(ep).slice(0,5);
  mFeed.classList.add('flash');clearTimeout(feedFlashT);feedFlashT=setTimeout(()=>mFeed.classList.remove('flash'),1600);if(POP==='feed')renderPop();}
function findAgentNode(sid,name){const lc=(name||'').toLowerCase();for(const n of nodes.values())if(n.kind==='agent'&&n.sess.id===sid&&n.ag.name.toLowerCase()===lc)return n;return null;}
function findLeadBySession(sid){return nodes.get('s:'+sid)||null;}
function findLeadByName(name){const lc=(name||'').toLowerCase();for(const n of nodes.values())if(n.kind==='session'&&(n.sess.name.toLowerCase()===lc||lc.startsWith(n.sess.name.toLowerCase())))return n;for(const n of nodes.values())if(n.kind==='lead'&&n.proj.name.toLowerCase()===lc)return n;return null;}
function send(a,b,kind,speed){if(a&&b&&a!==b)parts.push({a,b,t:0,kind:kind||'ink',speed:speed||0.012});}
function handleEvent(e){
  if(e.kind==='edge'){
    if(e.hub){send(hub,findLeadByName(e.to),'dispatch');hub.pulse=1;return;}
    const L=findLeadBySession(e.session);
    const from=e.from==='__main__'?L:findAgentNode(e.session,e.from);
    const toLc=(e.to||'').toLowerCase();const to=(toLc==='team-lead'||toLc==='main'||toLc==='lead')?L:(findAgentNode(e.session,e.to)||L);
    send(from,to,'ink',0.02);if(from&&from!==L)camFocus(from);if(to&&to!==L)camFocus(to);return;}
  const L=findLeadBySession(e.session);const where=e.where||'';
  if(e.kind==='dispatch'){pushFeed('dispatch',e.who,e.what,where,e.epoch);hub.pulse=1;return;}
  if(performance.now()>armedAt&&/^(approval|done|start|user)$/.test(e.kind))camFocus(findAgentNode(e.session,e.who)||L);
  if(e.kind==='approval'){pushFeed('approval',e.who,e.what,where,e.epoch);if(L){send(findAgentNode(e.session,e.who),L,'approval',0.02);setTimeout(()=>send(L,hub,'approval'),1200);}}
  else if(e.kind==='done'){pushFeed('done',e.who,e.what,where,e.epoch);if(L)send(findAgentNode(e.session,e.who),L,'done',0.02);}
  else if(e.kind==='start'){pushFeed('start',e.who,e.what,where,e.epoch);if(L){send(L,findAgentNode(e.session,e.who),'ink',0.02);L.pulse=1;}}
  else if(e.kind==='user'){pushFeed('user',e.who,e.what,where,e.epoch);if(L){L.pulse=1;L.glow=1;}}
  else{if(e.kind==='tool'&&/^(Read|Grep|Glob|TaskList|TaskGet|ListAgents|ToolSearch) /.test(e.what||''))return;pushFeed(e.kind==='msg'?'msg':'tool',e.who,(e.what||'').slice(0,70),where,e.epoch);}
}

/* markdown mínimo, sem dependência externa: títulos, listas, tabelas, código, negrito, links, wikilinks */

    if(/^```/.test(l)){closeList();let code='';i++;while(i<lines.length&&!/^```/.test(lines[i])){code+=lines[i]+'\n';i++;}out+=`<pre><code>${esc(code)}</code></pre>`;i++;continue;}
    if(/^\|/.test(l)&&/^\|?\s*:?-+/.test(lines[i+1]||'')){closeList();const hdr=l.split('|').filter((c,k,a)=>k>0&&k<a.length-1);let rows=[];i+=2;while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i].split('|').filter((c,k,a)=>k>0&&k<a.length-1));i++;}
      out+=`<table><tr>${hdr.map(h=>`<th>${inline(h.trim(),links)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c.trim(),links)}</td>`).join('')}</tr>`).join('')}</table>`;continue;}
    let m;
    if((m=l.match(/^(#{1,4})\s+(.*)/))){closeList();out+=`<h${m[1].length}>${inline(m[2],links)}</h${m[1].length}>`;}
    else if(/^\s*[-*]\s+/.test(l)){if(list!=='ul'){closeList();out+='<ul>';list='ul';}out+=`<li>${inline(l.replace(/^\s*[-*]\s+/,''),links)}</li>`;}
    else if(/^\s*\d+[.)]\s+/.test(l)){if(list!=='ol'){closeList();out+='<ol>';list='ol';}out+=`<li>${inline(l.replace(/^\s*\d+[.)]\s+/,''),links)}</li>`;}
    else if(/^>\s?/.test(l)){closeList();out+=`<blockquote>${inline(l.replace(/^>\s?/,''),links)}</blockquote>`;}
    else if(/^(-{3,}|\*{3,})\s*$/.test(l)){closeList();out+='<hr>';}

    else{closeList();let p=l;while(i+1<lines.length&&lines[i+1].trim()&&!/^(#|\s*[-*]\s|\s*\d+[.)]\s|>|```|\||-{3,})/.test(lines[i+1])){i++;p+=' '+lines[i];}out+=`<p>${inline(p,links)}</p>`;}
    i++;}
  closeList();return out;}

function gSync(reheat){

function gTick(){

  const CELL=300,grid=new Map();
  ns.forEach((n,i)=>{n.i=i;const key=Math.floor(n.x/CELL)+','+Math.floor(n.y/CELL);(grid.get(key)||grid.set(key,[]).get(key)).push(n);});
  ns.forEach(n=>{const cx=Math.floor(n.x/CELL),cy=Math.floor(n.y/CELL);
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){const c=grid.get((cx+ox)+','+(cy+oy));if(!c)continue;
      for(const m of c){if(m.i<=n.i)continue;let dx=m.x-n.x,dy=m.y-n.y,d2=dx*dx+dy*dy;if(d2>CELL*CELL)continue;if(d2<1){dx=Math.random()-0.5;dy=Math.random()-0.5;d2=1;}

  const w=gf.clientWidth,h=gf.clientHeight;if(!w||!h)return;
  if(gf.width!==Math.round(w*DPR)||gf.height!==Math.round(h*DPR)){gf.width=Math.round(w*DPR);gf.height=Math.round(h*DPR);G.dirty=true;}
  const x=gfx,v=G.view;x.setTransform(DPR,0,0,DPR,0,0);
  const bg=x.createRadialGradient(w*0.45,h*0.5,40,w*0.45,h*0.5,Math.max(w,h)*0.75);bg.addColorStop(0,'#101116');bg.addColorStop(1,'#07070a');x.fillStyle=bg;x.fillRect(0,0,w,h);
  const cur=G.byK.get(V.cur),fo=G.drag||G.hover,hl=fo?new Set([fo.k,...G.adj.get(fo.k)]):null;
  const rs=n=>n.r*GS.size*Math.min(1.7,Math.max(0.65,Math.sqrt(v.k)));
  G.sim.nodes.forEach(n=>{n.sx=v.x+n.x*v.k;n.sy=v.y+n.y*v.k;n.rs=rs(n);});
  x.lineCap='round';
  G.sim.links.forEach(([a,b])=>{const on=fo&&(a===fo||b===fo),dim=hl&&!on;
    x.strokeStyle=on?'rgba(130,175,255,.9)':dim?'rgba(170,180,210,.05)':'rgba(170,180,210,.17)';x.lineWidth=(on?1.6:1)*GS.link;
    x.beginPath();x.moveTo(a.sx,a.sy);x.lineTo(b.sx,b.sy);x.stroke();});
  const lab=[];
  G.sim.nodes.forEach(n=>{const c=GCOL[n.g]||GCOL.other,isC=n===cur,isF=n===fo,dim=hl&&!hl.has(n.k);
    if(isC||isF){const g=x.createRadialGradient(n.sx,n.sy,n.rs,n.sx,n.sy,n.rs*4.2);g.addColorStop(0,hex2(c,isF?0.45:0.32));g.addColorStop(1,hex2(c,0));x.fillStyle=g;x.beginPath();x.arc(n.sx,n.sy,n.rs*4.2,0,6.283);x.fill();}
    x.globalAlpha=dim?0.16:1;x.beginPath();x.arc(n.sx,n.sy,n.rs,0,6.283);x.fillStyle=c;x.fill();
    x.lineWidth=1;x.strokeStyle='rgba(8,8,11,.55)';x.stroke();
    if(isC){x.beginPath();x.arc(n.sx,n.sy,n.rs+3,0,6.283);x.strokeStyle='#f1f1f3';x.lineWidth=1.5;x.stroke();}
    x.globalAlpha=1;
    const strong=isC||isF||(hl&&hl.has(n.k)),fade=Math.min(1,Math.max(0,(v.k-GS.labelAt*(n.deg>=6?0.7:1))/0.45));
    if(strong||(!hl&&fade>0.02))lab.push([n,strong?1:fade,strong]);});
  x.font='400 11px Montserrat,system-ui,sans-serif';x.textAlign='center';x.textBaseline='top';x.lineJoin='round';
  lab.sort((a,b)=>(b[2]-a[2])||(b[0].deg-a[0].deg));const placed=[];   // prioridade: destaque > nós mais ligados; nome que colide com outro já posto não é desenhado
  lab.forEach(([n,al,strong])=>{const s=gTrunc(n.t,30),y=n.sy+n.rs+(n===cur?7:5),wv=x.measureText(s).width,r=[n.sx-wv/2-4,y-2,n.sx+wv/2+4,y+15];
    if(!strong&&placed.some(p=>r[0]<p[2]&&r[2]>p[0]&&r[1]<p[3]&&r[3]>p[1]))return;placed.push(r);
    x.lineWidth=3.2;x.strokeStyle=`rgba(7,7,10,${0.85*al})`;x.strokeText(s,n.sx,y);
    x.fillStyle=n===cur||n===fo?`rgba(255,255,255,${al})`:strong?`rgba(226,230,240,${al})`:`rgba(168,174,188,${al})`;x.fillText(s,n.sx,y);});
}
function gThumbLayout(){
  const c=G.byK.get(V.cur);if(!c)return [];
  const r1=[...G.adj.get(c.k)].map(k=>G.byK.get(k)).filter(n=>n&&!G.off.has(n.g)).sort((a,b)=>a.g.localeCompare(b.g)||a.t.localeCompare(b.t)).slice(0,40);
  return [{n:c,x:0,y:0},...r1.map((n,i)=>{const a=-Math.PI/2+i/r1.length*6.283,r=r1.length>22&&i%2?1.25:1;return {n,x:Math.cos(a)*r,y:Math.sin(a)*r};})];
}
function gThumb(){
  const w=vg.clientWidth,h=vg.clientHeight;if(!w||!h)return;if(vg.width!==Math.round(w*DPR)||vg.height!==Math.round(h*DPR)){vg.width=Math.round(w*DPR);vg.height=Math.round(h*DPR);}
  const x=vctx;x.setTransform(DPR,0,0,DPR,0,0);x.clearRect(0,0,w,h);vg._hit=[];
  const L=gThumbLayout();if(!L.length)return;const K=Math.min(w,h)/2-22,X=w/2,Y=h/2;
  L.slice(1).forEach(o=>{x.strokeStyle='rgba(130,175,255,.45)';x.lineWidth=1;x.beginPath();x.moveTo(X,Y);x.lineTo(X+o.x*K,Y+o.y*K);x.stroke();});
  L.forEach((o,i)=>{const sx=X+o.x*K,sy=Y+o.y*K,r=(i?2.8:5)+Math.min(4,Math.sqrt(o.n.deg)*0.8);x.beginPath();x.arc(sx,sy,r,0,6.283);x.fillStyle=GCOL[o.n.g]||GCOL.other;x.fill();
    if(!i){x.strokeStyle='#f1f1f3';x.lineWidth=1.4;x.beginPath();x.arc(sx,sy,r+2.5,0,6.283);x.stroke();}vg._hit.push({n:o.n,x:sx,y:sy,r:r+6});});
}

/* ---- laço: física + vista suave só quando há movimento; redesenha miniatura quando a nota muda ---- */
function gloop(){
  if(document.body.classList.contains('vault-open')&&G.nodes.length){
    const full=document.body.classList.contains('graph-full');let moving=false;
    if(full){
      if(G.drag)G.alpha=Math.max(G.alpha,0.3);
      for(let i=0;i<(G.alpha>0.5?2:1);i++)if(gTick())moving=true;
      if(G.autofit&&!G.drag){gFit(false);}
      if(G.tgt){const v=G.view,t=G.tgt,e=Math.abs(t.k-v.k)+Math.abs(t.x-v.x)/200+Math.abs(t.y-v.y)/200;
        if(G.autofit&&e>0.002){v.k+=(t.k-v.k)*0.14;v.x+=(t.x-v.x)*0.14;v.y+=(t.y-v.y)*0.14;moving=true;}}
      if(moving||G.dirty)try{gRender();}catch(e){console.error('grafo',e);}
    }
    if(G.dirty){try{gThumb();}catch(e){console.error('miniatura',e);}G.dirty=false;}
  }
  requestAnimationFrame(gloop);}

/* ---- interação: arrastar nó, mover fundo, zoom, hover, clique, duplo clique ---- */
const gHit=(mx,my)=>{let best=null,bd=1e9;for(const n of G.sim.nodes){const d=Math.hypot(n.sx-mx,n.sy-my);if(d<n.rs+6&&d<bd){bd=d;best=n;}}return best;};
const thHit=(mx,my)=>{let best=null,bd=1e9;(vg._hit||[]).forEach(h=>{const d=Math.hypot(h.x-mx,h.y-my);if(d<h.r&&d<bd){bd=d;best=h.n;}});return best;};
const gPos=(cv,e)=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
const gWorld=(mx,my)=>({x:(mx-G.view.x)/G.view.k,y:(my-G.view.y)/G.view.k});
function gExit(){document.body.classList.remove('graph-full');vGraphBtn.textContent='Grafo ⤢';G.dirty=true;}
vGraphBtn.onclick=()=>{const on=document.body.classList.toggle('graph-full');vGraphBtn.textContent=on?'← Ler nota':'Grafo ⤢';if(on){G.autofit=true;G.alpha=Math.max(G.alpha,0.5);}G.dirty=true;};
gf.addEventListener('pointerdown',e=>{gf.setPointerCapture(e.pointerId);const [mx,my]=gPos(gf,e),n=gHit(mx,my);G.moved=false;G.down={x:e.clientX,y:e.clientY};
  if(n){G.drag=n;const p=gWorld(mx,my);n.fx=p.x;n.fy=p.y;G.autofit=false;gf.style.cursor='grabbing';}
  else{G.pan={x:e.clientX,y:e.clientY,vx:G.view.x,vy:G.view.y};G.autofit=false;gf.style.cursor='grabbing';}});
gf.addEventListener('pointermove',e=>{const [mx,my]=gPos(gf,e);
  if(G.down&&Math.hypot(e.clientX-G.down.x,e.clientY-G.down.y)>4)G.moved=true;
  if(G.drag){const p=gWorld(mx,my);G.drag.fx=p.x;G.drag.fy=p.y;G.dirty=true;return;}
  if(G.pan){G.view.x=G.pan.vx+e.clientX-G.pan.x;G.view.y=G.pan.vy+e.clientY-G.pan.y;G.dirty=true;return;}
  const h=gHit(mx,my);if(h!==G.hover){G.hover=h;G.dirty=true;}
  if(h){gtip.style.display='block';gtip.style.left=Math.min(mx+16,gf.clientWidth-290)+'px';gtip.style.top=Math.min(my+16,gf.clientHeight-90)+'px';
    gtip.innerHTML=`<b>${esc(h.t)}</b><small>${esc(h.k)}</small><span><i style="background:${GCOL[h.g]}"></i>${GNAME[h.g]} · ${h.deg} ligações${h.status?' · '+esc(h.status):''}</span>`;gf.style.cursor='pointer';}
  else{gtip.style.display='none';gf.style.cursor='grab';}});
const gUp=e=>{const d=G.drag;if(d){d.fx=d.fy=null;G.drag=null;if(!G.moved)showNote(d.k);}G.pan=null;G.down=null;gf.style.cursor='grab';G.dirty=true;};
gf.addEventListener('pointerup',gUp);gf.addEventListener('pointercancel',gUp);
gf.addEventListener('pointerleave',()=>{if(!G.drag){G.hover=null;gtip.style.display='none';G.dirty=true;}});
gf.addEventListener('wheel',e=>{e.preventDefault();const [mx,my]=gPos(gf,e),v=G.view,k=Math.min(5,Math.max(0.15,v.k*(e.deltaY<0?1.12:0.89)));v.x=mx-(mx-v.x)/v.k*k;v.y=my-(my-v.y)/v.k*k;v.k=k;G.autofit=false;G.dirty=true;},{passive:false});
gf.addEventListener('dblclick',e=>{const [mx,my]=gPos(gf,e),n=gHit(mx,my);if(n){showNote(n.k);gExit();}else{G.autofit=true;G.alpha=Math.max(G.alpha,0.4);}});
vg.addEventListener('click',e=>{const [mx,my]=gPos(vg,e),n=thHit(mx,my);if(n)showNote(n.k);});
vg.addEventListener('mousemove',e=>{const [mx,my]=gPos(vg,e),n=thHit(mx,my);vg.style.cursor=n?'pointer':'default';vg.title=n?n.t:'';});
/* ---- controles ---- */
document.getElementById('gfull').addEventListener('click',e=>{const t=e.target.closest('[data-gm],[data-gd],[data-gg],#gReset,#gPanelBtn');if(!t)return;
  if(t.id==='gPanelBtn'){document.getElementById('gPanel').classList.toggle('shut');return;}
  if(t.id==='gReset'){Object.assign(GS,GDEF);gSave();gSliders();G.nodes.forEach(n=>{const a=Math.random()*6.283,r=140+Math.random()*180;n.x=Math.cos(a)*r;n.y=Math.sin(a)*r;});gSync(true);gWarm(60);return;}
  if(t.dataset.gm)G.mode=t.dataset.gm;else if(t.dataset.gd)G.depth=+t.dataset.gd;
  else if(t.dataset.gg){G.off.has(t.dataset.gg)?G.off.delete(t.dataset.gg):G.off.add(t.dataset.gg);}
  gSync(true);});
document.getElementById('gfull').addEventListener('input',e=>{const t=e.target;
  if(t.id==='gQ'){G.q=t.value;gSync(true);return;}
  if(t.dataset.gs){GS[t.dataset.gs]=+t.value;document.getElementById('gv-'+t.dataset.gs).textContent=(+t.value).toFixed(t.value<10?2:0);gSave();if(['center','repel','spring','dist'].includes(t.dataset.gs))G.alpha=Math.max(G.alpha,0.6);G.dirty=true;}});
document.getElementById('gfull').addEventListener('change',e=>{const t=e.target;if(t.id==='gOrph'){GS.orphans=t.checked;}else if(t.id==='gHub'){GS.hubs=t.checked;}else return;gSave();gSync(true);});
addEventListener('resize',()=>{G.dirty=true;});new ResizeObserver(()=>{G.autofit=true;G.dirty=true;}).observe(gf);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.body.classList.contains('graph-full'))gExit();else if(document.body.classList.contains('vault-open'))vBack.onclick();else if(document.body.classList.contains('open'))closeDrawer();}});

resize();connect();requestAnimationFrame(frame);requestAnimationFrame(gloop);
</script>
